<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZONE Panel - Secure Management</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --danger: #f85149;
            --success: #2ea043;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .header {
            background: #21262d;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            color: var(--accent-color);
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .captcha-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #0d1117;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .captcha-code {
            background: var(--accent-color);
            color: #0d1117;
            padding: 8px 15px;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 3px;
            border-radius: 4px;
            user-select: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #0d1117;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
            color: #ffffff;
        }

        .hidden {
            display: none !important;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            background: #21262d;
            color: var(--accent-color);
        }

        .alert {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }
        .alert-error {
            background: rgba(248, 81, 73, 0.15);
            color: var(--danger);
            border: 1px solid var(--danger);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>ZONE Panel Management</h1>
            <p>Secure System & Verification Portal</p>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="content">
            <div id="loginError" class="alert alert-error hidden">Invalid credentials or captcha!</div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username (admin)">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password (admin123)">
            </div>
            
            <div class="form-group">
                <label>Security Captcha Verification</label>
                <div class="captcha-box">
                    <div id="captchaDisplay" class="captcha-code">4829</div>
                    <button type="button" onclick="generateCaptcha()" style="width: auto; padding: 8px 12px; font-size: 12px;">Refresh</button>
                </div>
                <input type="text" id="captchaInput" placeholder="Enter the code shown above">
            </div>

            <button onclick="handleLogin()">Login to Dashboard</button>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="content hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: var(--accent-color);">Live Official Data</h2>
                <button onclick="location.reload()" style="width: auto; background: var(--danger); color: white; padding: 6px 12px; font-size: 14px;">Logout</button>
            </div>
            
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Member</th>
                            <th>Number</th>
                            <th>OTP</th>
                            <th>Country</th>
                            <th>Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center; color: var(--text-muted);">Loading live data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentCaptcha = "";

        function generateCaptcha() {
            const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let captcha = "";
            for (let i = 0; i < 4; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentCaptcha = captcha;
            document.getElementById("captchaDisplay").innerText = captcha;
        }

        // Generate captcha on page load
        window.onload = function() {
            generateCaptcha();
        };

        async function handleLogin() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const userInputCaptcha = document.getElementById("captchaInput").value;
            const errorDiv = document.getElementById("loginError");

            if (userInputCaptcha.toUpperCase() !== currentCaptcha) {
                errorDiv.innerText = "Incorrect Captcha Code!";
                errorDiv.classList.remove("hidden");
                generateCaptcha();
                return;
            }

            try {
                const response = await fetch('/api/manager/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const result = await response.json();

                if (result.success) {
                    document.getElementById("loginSection").classList.add("hidden");
                    document.getElementById("dashboardSection").classList.remove("hidden");
                    fetchData();
                    setInterval(fetchData, 5000); // Auto refresh data
                } else {
                    errorDiv.innerText = result.message || "Login failed.";
                    errorDiv.classList.remove("hidden");
                    generateCaptcha();
                }
            } catch (err) {
                errorDiv.innerText = "Server connection error.";
                errorDiv.classList.remove("hidden");
                generateCaptcha();
            }
        }

        async function fetchData() {
            try {
                const res = await fetch('/api/get-official-sms');
                const json = await res.json();
                if (json.success && json.data) {
                    const tbody = document.getElementById("dataTableBody");
                    if (json.data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No records found.</td></tr>`;
                        return;
                    }
                    tbody.innerHTML = json.data.map(item => `
                        <tr>
                            <td>${item.member || '-'}</td>
                            <td>${item.number || '-'}</td>
                            <td style="color: var(--accent-color); font-weight: bold;">${item.otp || '-'}</td>
                            <td>${item.country || '-'}</td>
                            <td>${item.time || '-'}</td>
                            <td><span style="color: var(--success);">${item.report || 'Active'}</span></td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                console.error("Error fetching data");
            }
        }
    </script>
</body>
                    </html>
